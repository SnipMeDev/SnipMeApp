name: flutter_module
description: A new flutter module project.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

scripts:
  # run is a default script. To use it, simply type " in the command line: "rps" - that's all!
  add: "fvm flutter pub add"
  get: "fvm flutter pub get"
  gen: "fvm flutter pub run build_runner build --delete-conflicting-outputs"
  run: "fvm flutter run"
  pigeon: "fvm dart run pigeon --input=channel/contract.dart"

dependencies:
  equatable: ^2.0.5
  flutter_hooks: ^0.20.5
  test: ^1.21.4
  go_router: ^6.5.9
  go_router_plus: ^4.1.1
  validators: ^3.0.0
  logger: ^2.4.0
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  screenshot: ^3.0.0
dev_dependencies:
  build_runner: ^2.2.1
  flutter_lints: ^4.0.0
  pigeon: ^24.2.0

flutter_assets_generator:
  named_with_parent: false # Don't add folder to icons's name

flutter:
  plugin:
    platforms:
      android:
        package: dev.snipme.snipmeapp
        pluginClass: PigeonPlugin
      ios:
        pluginClass: PigeonPlugin
  uses-material-design: true
  assets:
    - assets/images/illustrations/app_logo.png
  fonts:
    - family: Kanit
      fonts:
        - asset: fonts/Kanit-Regular.ttf

  module:
    androidX: true
    androidPackage: dev.snipme.flutter_module
    iosBundleIdentifier: dev.snipme.flutterModule
